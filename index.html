const cur=()=>ST.stage!=='app'?{v:ST.stage}:ST.stack.length?ST.stack[ST.stack.length-1]:{v:ST.tab};

/* ---------- shell ---------- */
function applyLook(){const r=document.documentElement;r.dataset.pal=S.pal;r.dataset.theme=S.dark?'dark':'light';r.dataset.shape=S.shape}
function looks(){return `<div class="lab" style="margin-top:12px">Colour</div><div class="dots">${PALS.map(p=>`<button class="dotb ${S.pal===p[0]?'on':''}" style="background:${p[2]}" data-act="pal" data-v="${p[0]}" aria-label="${p[1]}" title="${p[1]}"></button>`).join('')}</div>
 <div class="lab">Mode</div><div class="chips"><button class="chip ${!S.dark?'on':''}" data-act="dark" data-v="0">Light</button><button class="chip ${S.dark?'on':''}" data-act="dark" data-v="1">Dark</button></div>
 <div class="lab">Corners</div><div class="chips"><button class="chip ${S.shape==='soft'?'on':''}" data-act="shape" data-v="soft">Soft</button><button class="chip ${S.shape==='sharp'?'on':''}" data-act="shape" data-v="sharp">Sharp</button></div>`}
const panelHTML=()=>`<h3>Design controls</h3><p class="mut" style="font-size:14px">Try each look live, then tell us which one you love.</p>${looks()}<button class="btn o sm full" style="margin-top:18px" data-act="restart">Restart demo</button>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function sheet(h){$('#sheet').innerHTML='<div class="grab"></div><button class="sx" data-act="close" aria-label="Close">&times;</button>'+h;$('#ov').classList.add('on')}
const close=()=>$('#ov').classList.remove('on');
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
const navHTML=()=>NAVS[S.role].map(n=>`<button class="${ST.tab===n[0]?'on':''}" data-act="tab" data-v="${n[0]}">${ic(n[2])}${n[1]}${n[0]==='msgs'&&unread()?`<i class="badge">${unread()}</i>`:''}</button>`).join('');
function draw(keep){
 clearInterval(ST.tmr);
 const old=$('#cur'),y=keep&&old?old.scrollTop:0,c=cur(),html=V[c.v](c.a);
 $('#main').innerHTML=FULL.includes(c.v)?html:`<section class="scr ${FLUSH.includes(c.v)?'p0':''}" id="cur">${html}</section>`;
 const show=ST.stage==='app'&&!ST.stack.length,nv=$('#nav');nv.className='nav'+(show?' on':'');if(show)nv.innerHTML=navHTML();
 const e=$('#cur');if(e)e.scrollTop=y;
 if(c.v==='thread')e.scrollTop=e.scrollHeight;
 if(c.v==='track')startTrack(c.a);
 $('#panel').innerHTML=panelHTML();
}
const push=(v,a)=>{ST.stack.push({v,a});draw()};
const back=()=>{ST.stack.pop();draw()};
const goTab=t=>{ST.tab=t;ST.stack=[];draw()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset.v,a,e)});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},20000);
$('#clk').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const hdr=(t,r='')=>`<div class="top"><div class="row"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>${t}</h1></div>${r}</div>`;
A.tab=v=>goTab(v);A.back=()=>{if(ST.stack.length)back();else{const h=S.role==='cg'?'jobs':'home';if(ST.tab!==h)goTab(h)}};A.go=v=>push(v);
A.pal=v=>{S.pal=v;applyLook();draw(true)};A.dark=v=>{S.dark=v==='1';applyLook();draw(true)};A.shape=v=>{S.shape=v;applyLook();draw(true)};
A.restart=()=>{ST.stage='onb';ST.slide=0;ST.stack=[];S.role='client';draw()};
A.switch=()=>{S.role=S.role==='cg'?'client':'cg';ST.tab=S.role==='cg'?'jobs':'home';ST.stack=[];draw()};
A.close=()=>close();

/* ---------- login ---------- */
const LG={mode:'in',show:false,err:'',ph:'',nm:'',pw:'',pw2:''};
const lgKeep=()=>{['lph','lnm','lpw','lpw2'].forEach(id=>{const e=$('#'+id);if(e)LG[{lph:'ph',lnm:'nm',lpw:'pw',lpw2:'pw2'}[id]]=e.value})};
V.login=()=>{const up=LG.mode==='up',ty=LG.show?'text':'password';
 return `<div class="onb" style="justify-content:flex-start;padding-top:14px"><button class="ib" data-act="lback" aria-label="Back">${ic('back')}</button>
 <img class="logo lg" src="${LOGO}" alt="Bushemi Clinic" style="margin-top:6px">
 <div class="seg" role="tablist"><button class="${!up?'on':''}" data-act="lmode" data-v="in">Sign in</button><button class="${up?'on':''}" data-act="lmode" data-v="up">Create account</button></div>
 ${up?`<div class="fld"><label for="lnm">Full name</label><input id="lnm" autocomplete="name" placeholder="e.g. Mutinta Banda" value="${esc(LG.nm)}"></div>`:''}
 <div class="fld"><label for="lph">Phone number</label><div class="pre"><span>+260</span><input id="lph" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="97 123 4567" value="${esc(LG.ph)}"></div></div>
 <div class="fld"><label for="lpw">Password</label><div class="pw"><input id="lpw" type="${ty}" autocomplete="${up?'new-password':'current-password'}" placeholder="At least 6 characters" value="${esc(LG.pw)}"><button type="button" data-act="lshow">${LG.show?'Hide':'Show'}</button></div></div>
 ${up?`<div class="fld"><label for="lpw2">Confirm password</label><input id="lpw2" type="${ty}" autocomplete="new-password" value="${esc(LG.pw2)}"></div>`:''}
 <div class="err" role="alert">${LG.err}</div>
 <button class="btn full" data-act="lgo">${up?'Create account':'Sign in'}</button>
 ${up?'':'<button class="btn sm" style="background:none;color:var(--p);margin:8px auto 0;display:flex" data-act="lforgot">Forgot password?</button>'}
 <div class="between" style="margin:14px 0 10px;color:var(--mut);font-size:13px"><hr style="flex:1;border:0;border-top:1px solid var(--line)"><span style="padding:0 10px">or</span><hr style="flex:1;border:0;border-top:1px solid var(--line)"></div>
 <button class="btn o full" data-act="lotp">${ic('chat','sm')} Get a code by SMS</button>
 <button class="btn sm" style="background:none;color:var(--mut);margin:10px auto 0;display:flex" data-act="lguest">Continue as guest</button>
 <p class="ctr" style="color:var(--mut);font-size:12px;margin-top:12px">Demo mode: any valid details will sign you in.</p></div>`};
A.lback=()=>{lgKeep();ST.stage='onb';ST.slide=SL.length-1;draw()};
A.lmode=v=>{lgKeep();LG.mode=v;LG.err='';draw()};
A.lshow=()=>{lgKeep();LG.show=!LG.show;draw()};
A.lgo=()=>{lgKeep();const d=LG.ph.replace(/\D/g,'').replace(/^0/,'');let e='';
 if(LG.mode==='up'&&LG.nm.trim().length<2)e='Enter your full name.';
 else if(d.length<9||d.length>10)e='Enter a valid Zambian phone number.';
 else if(LG.pw.length<6)e='Password must be at least 6 characters.';
 else if(LG.mode==='up'&&LG.pw!==LG.pw2)e='Passwords do not match.';
 LG.err=e;if(e){draw();return}
 if(LG.mode==='up')S.user.name=LG.nm.trim();LG.pw=LG.pw2='';ST.stage='role';draw();toast(LG.mode==='up'?'Account created':'Welcome back')};
A.lforgot=()=>{lgKeep();sheet(`<h1>Reset password</h1><p class="mut" style="margin:6px 0 12px">We will send a reset code by SMS to the phone number you use to sign in.</p><button class="btn full" data-act="lreset">Send reset code</button>`)};
A.lreset=()=>{close();toast('Reset code sent by SMS')};
A.lotp=()=>{lgKeep();sheet(`<h1>Sign in with a code</h1><p class="mut" style="margin:6px 0 12px">Enter the 4 digit code we send to your phone.</p><input id="otp" inputmode="numeric" maxlength="4" placeholder="0 0 0 0" style="text-align:center;font-size:22px;letter-spacing:8px"><div class="err" id="oerr"></div><button class="btn full" data-act="otpok">Verify and continue</button>`)};
A.otpok=()=>{const v=($('#otp').value||'').replace(/\D/g,'');if(v.length!==4){$('#oerr').textContent='Enter the 4 digit code.';return}close();ST.stage='role';draw();toast('Verified')};
A.lguest=()=>{lgKeep();ST.stage='role';draw()};
A.signout=()=>{ST.stage='login';ST.stack=[];S.role='client';LG.mode='in';LG.err='';LG.pw=LG.pw2='';close();draw()};

/* ---------- onboarding ---------- */
const SL=[
 {t:'Care that comes to you',d:'Nurses, doctors, physios and caregivers at your door, in Lusaka.',s:'<circle cx="120" cy="120" r="100" style="fill:var(--soft)"/><path d="M60 125l60-50 60 50v55a6 6 0 0 1-6 6H66a6 6 0 0 1-6-6z" style="fill:var(--solid);stroke:var(--p)" stroke-width="5" stroke-linejoin="round"/><path d="M120 105v40M100 125h40" style="stroke:var(--a)" stroke-width="10" stroke-linecap="round"/>'},
 {t:'See a doctor on video',d:'Skip the queue. Talk to a doctor, dietician or therapist from home.',s:'<circle cx="120" cy="120" r="100" style="fill:var(--soft)"/><rect x="82" y="50" width="76" height="140" rx="14" style="fill:var(--solid);stroke:var(--p)" stroke-width="5"/><circle cx="120" cy="105" r="20" style="fill:var(--p)"/><path d="M88 160c5-18 19-24 32-24s27 6 32 24" style="fill:var(--p)"/><circle cx="168" cy="72" r="14" style="fill:var(--a)"/><path d="M162 72l4 4 8-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>'},
 {t:'Trusted, verified caregivers',d:'Every provider is ID, licence and background checked. Rated by real families.',s:'<circle cx="120" cy="120" r="100" style="fill:var(--soft)"/><path d="M120 44l62 22v48c0 38-26 62-62 72-36-10-62-34-62-72V66z" style="fill:var(--solid);stroke:var(--p)" stroke-width="5" stroke-linejoin="round"/><path d="M92 120l20 20 38-40" fill="none" style="stroke:var(--a)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>'}];
V.onb=()=>{const s=SL[ST.slide],last=ST.slide===SL.length-1;return `<div class="onb">${ST.slide>0?`<button class="ib" style="position:absolute;top:14px;left:16px" data-act="oback" aria-label="Back">${ic('back')}</button>`:''}<img class="logo sm" src="${LOGO}" alt="Bushemi Clinic" style="margin-top:8px"><div class="ill" style="padding-top:16px"><svg viewBox="0 0 240 240" aria-hidden="true">${s.s}</svg></div><h1 class="ctr">${s.t}</h1><p class="mut ctr" style="margin-top:8px">${s.d}</p><div class="dts">${SL.map((_,i)=>`<i class="${i===ST.slide?'on':''}"></i>`).join('')}</div><button class="btn full" data-act="onext">${last?'Get started':'Next'}</button>${last?'':'<button class="btn sm" style="background:none;color:var(--mut);margin:8px auto 0;display:flex" data-act="oskip">Skip</button>'}</div>`};
A.onext=()=>{if(ST.slide<SL.length-1){ST.slide++;draw()}else{ST.stage='login';draw()}};A.oskip=()=>{ST.stage='login';draw()};A.oback=()=>{if(ST.slide>0){ST.slide--;draw()}};
V.role=()=>`<div class="onb" style="justify-content:flex-start;padding-top:14px"><button class="ib" data-act="rback" aria-label="Back" style="margin-bottom:14px">${ic('back')}</button><h1>Welcome to Bushemi</h1><p class="mut" style="margin:6px 0 18px">How would you like to use the app?</p>
 <button class="rdo" data-act="pick" data-v="client" style="padding:18px"><span class="ib" style="box-shadow:none;background:var(--soft);color:var(--p)">${ic('heart')}</span><div class="b"><b>I need care</b><small>Book care for me or my family</small></div>${ic('back').replace('<svg class="i "','<svg class="i " style="transform:rotate(180deg)"')}</button>
 <button class="rdo" data-act="pick" data-v="cg" style="padding:18px"><span class="ib" style="box-shadow:none;background:var(--grns);color:var(--grn)">${ic('bag')}</span><div class="b"><b>I am a caregiver</b><small>Get jobs, set your hours, earn</small></div>${ic('back').replace('<svg class="i "','<svg class="i " style="transform:rotate(180deg)"')}</button>
 <p class="muted ctr" style="margin-top:14px;color:var(--mut);font-size:13px">You can switch between these any time in your profile.</p></div>`;
A.rback=()=>{ST.stage='login';draw()};
A.pick=v=>{S.role=v==='cg'?'cg':'client';ST.stage='app';ST.tab=S.role==='cg'?'jobs':'home';ST.stack=[];draw()};

/* ---------- client home ---------- */
const cmpA=(a,b)=>dOf(a.d)-dOf(b.d);
const nextCard=a=>{const p=PV(a.pid),s=svOf(a.svc),live=a.st==='On the way';
 return `<div class="hero"><div class="between"><span class="pill pw">${live?'● On the way':'Next visit'}</span><span>${a.d===dkey(TODAY)?'Today':fmt(dOf(a.d))}, ${a.tm}</span></div><div class="hl">${s.full}</div><div class="hsub">with ${p.n} for ${esc(a.who)}</div>
 <div class="row" style="margin-top:14px">${live?`<button class="btn w sm" data-act="track" data-v="${a.id}">${ic('map','sm')} Track live</button>`:`<button class="btn w sm" data-act="tab" data-v="appts">View booking</button>`}<button class="btn gl sm" data-act="chat" data-v="${p.id}">${ic('chat','sm')} Message</button></div></div>`};
V.home=()=>{const nx=S.appts.filter(a=>!['Completed','Cancelled'].includes(a.st)).sort(cmpA)[0],bp=S.vit.bp,bd=S.vit.bpd,sg=S.vit.sugar;
 return `<div class="top"><button class="who" data-act="go" data-v="me">${av(S.user.name,PIC+'women/65.jpg',46)}<span><small>${greeting()}</small><b>${esc(first())}</b></span></button><div class="tr"><button class="ib" data-act="sos" aria-label="Emergency" style="color:var(--red)">${ic('sos')}</button><button class="ib" data-act="notif" aria-label="Notifications">${ic('bell')}<i class="nd"></i></button></div></div>
 <button class="loc" data-act="locs">${ic('pin','sm')} ${esc(S.loc)} ▾</button>
 <button class="search" data-act="tab" data-v="find">${ic('search')}<span>Search nurses, doctors, caregivers</span></button>
 ${nx?nextCard(nx):''}
 <h2>What do you need?</h2><div class="g4">${SV.map(s=>`<button class="tile" data-act="svcf" data-v="${s.id}"><span class="ti" style="background:linear-gradient(135deg,${s.c},${s.c}bb)">${ic(s.i)}</span>${s.n}</button>`).join('')}</div>
 <h2>Available now <a data-act="tab" data-v="find">See all</a></h2><div class="hs">${P.filter(p=>p.today).map(p=>`<button class="mini" data-act="prof" data-v="${p.id}">${av(p.n,p.ph,64)}<b>${p.n.split(' ')[0]}</b><small>${p.role}</small><span class="rt">${ic('star','st')}${p.r}</span></button>`).join('')}</div>
 <h2>My health <a data-act="tab" data-v="health">Open</a></h2><div class="card"><div class="row" style="gap:20px"><div style="flex:1"><small>Blood pressure</small><div style="font-size:22px;font-weight:800">${bp[bp.length-1]}/${bd[bd.length-1]}</div></div><div style="flex:1"><small>Blood sugar</small><div style="font-size:22px;font-weight:800">${sg[sg.length-1]} <small>mmol/L</small></div></div></div>${spark(bp,'var(--p)')}</div>
 <h2>Today's medicines</h2><div class="card">${S.meds.map(m=>medRow(m)).join('')}</div>
 ${S.voucherUsed?'':`<div class="promo"><b>10% off your first booking</b><p>Use code ${VOUCHER} when you pay.</p><button class="btn w sm" data-act="svcf" data-v="all">Book now</button>${ic('gift')}</div>`}`};
const medRow=m=>`<div class="li"><span class="ib" style="box-shadow:none;background:var(--soft);color:var(--p);width:42px;height:42px">${ic('pill','sm')}</span><div class="b"><b>${m.n}</b><small>${m.dose} · ${m.time}</small></div><button class="sw ${m.taken?'on':''}" data-act="med" data-v="${m.id}" role="switch" aria-checked="${m.taken}" aria-label="Taken: ${m.n}"></button></div>`;
A.med=v=>{const m=S.meds.find(x=>x.id==v);m.taken=!m.taken;draw(true);if(m.taken)toast(m.n+' marked as taken')};
A.svcf=v=>{S.f=v;S.q='';goTab('find')};
A.prof=v=>push('prof',+v);
A.chat=v=>{const id=+v;if(!S.threads[id])S.threads[id]=[];delete S.unread[id];push('thread',id)};
A.track=v=>push('track',+v);
A.fav=(v,b,e)=>{const id=+v,i=S.fav.indexOf(id);if(i>-1)S.fav.splice(i,1);else S.fav.push(id);draw(true)};
A.sos=()=>sheet(`<div class="ctr"><div class="tick" style="background:var(--redsoft);color:var(--red)">${ic('sos')}</div><h1>Emergency help</h1><p class="mut" style="margin:6px 0 16px">If someone is in danger, call the emergency number now.</p></div><div style="display:grid;gap:10px"><a class="btn sos" href="tel:112">${ic('phone')} Call 112 emergency</a><a class="btn o" href="tel:+260973702227">${ic('phone')} Call Bushemi 24 hours</a><button class="btn o" data-act="shareloc">${ic('pin')} Share my location with family</button><button class="btn" style="background:none;color:var(--mut)" data-act="close">Close</button></div>`);
A.shareloc=()=>{close();toast('Location sent to your family contacts')};
A.notif=()=>sheet(`<h1>Notifications</h1>${[['Grace is on the way to your mother\'s house','2 min ago'],['Reminder: take Metformin at 13:00','Today'],['Your doctor call is in 2 days','Yesterday']].map(n=>`<div class="li"><span class="ib" style="box-shadow:none;background:var(--soft);color:var(--p);width:42px;height:42px">${ic('bell','sm')}</span><div class="b"><b style="font-size:15px">${n[0]}</b><small>${n[1]}</small></div></div>`).join('')}`);
A.locs=()=>sheet(`<h1>Where do you need care?</h1>${S.addrs.map(a=>`<button class="rdo ${S.loc===a.a?'on':''}" data-act="setloc" data-v="${esc(a.a)}"><div class="b"><b>${esc(a.n)}</b><small>${esc(a.a)}</small></div><span class="rd"></span></button>`).join('')}<button class="btn o full" data-act="addaddr">+ Add a new address</button>`);
A.setloc=v=>{S.loc=v;close();draw(true)};
A.addaddr=()=>sheet(`<h1>Add an address</h1><label for="an">Name</label><input id="an" placeholder="For example: Office"><label for="aa">Area and street</label><input id="aa" placeholder="Area in Lusaka"><button class="btn o full" style="margin-top:12px" data-act="gps">Use my current location</button><button class="btn full" style="margin-top:10px" data-act="saveaddr">Save address</button>`);
A.gps=()=>{$('#aa').value='Chalala, near Hillview';toast('Location found')};
A.saveaddr=()=>{S.addrs.push({n:$('#an').value||'New address',a:$('#aa').value||'Lusaka'});close();toast('Address saved');draw(true)};

/* ---------- find ---------- */
const FCH=[['all','All'],...SV.map(s=>[s.id,s.n])];
function plist(){let l=P.filter(p=>(S.f==='all'||p.svc.includes(S.f))&&(!S.todayOnly||p.today)&&(!S.q||(p.n+' '+p.role+' '+p.area).toLowerCase().includes(S.q.toLowerCase())));
 l.sort((a,b)=>S.sort==='price'?minP(a)-minP(b):S.sort==='exp'?b.yrs-a.yrs:b.r-a.r);
 return l.length?l.map(pcard).join(''):`<div class="card ctr"><p class="mut">No providers match. Try another filter.</p></div>`}
const pcard=p=>`<div class="pc" data-act="prof" data-v="${p.id}">${av(p.n,p.ph,60)}<div class="b"><div class="nm">${p.n} ${ic('shield','vf')}</div><small>${p.role}</small><div class="meta">${ic('star','st')}<b>${p.r}</b> (${p.rv}) · ${p.area}</div><div class="meta">${p.today?'<span class="dot on"></span>Available today':'<span class="dot"></span>From tomorrow'} · from ${kw(minP(p))}</div></div><button class="fav ${S.fav.includes(p.id)?'on':''}" data-act="fav" data-v="${p.id}" aria-label="Save ${p.n}">${ic('heart')}</button></div>`;
V.find=()=>`<div class="top"><div class="row"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>Find care</h1></div></div><input id="q" type="search" placeholder="Name, role or area" value="${esc(S.q)}" aria-label="Search">
 <div class="hs" style="margin:12px 0 8px">${FCH.map(c=>`<button class="chip ${S.f===c[0]?'on':''}" data-act="ff" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
 <div class="between" style="margin-bottom:12px"><button class="chip ${S.todayOnly?'on':''}" data-act="tod">Available today</button><select id="srt" style="width:150px;min-height:40px;padding:6px 10px" aria-label="Sort"><option value="rating" ${S.sort==='rating'?'selected':''}>Top rated</option><option value="price" ${S.sort==='price'?'selected':''}>Lowest price</option><option value="exp" ${S.sort==='exp'?'selected':''}>Most experience</option></select></div>
 <div id="plist">${plist()}</div>`;
A.ff=v=>{S.f=v;draw(true)};A.tod=()=>{S.todayOnly=!S.todayOnly;draw(true)};
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#plist').innerHTML=plist()}});
document.addEventListener('change',e=>{if(e.target.id==='srt'){S.sort=e.target.value;$('#plist').innerHTML=plist()}if(e.target.id==='lng'){S.lang=e.target.value;toast('Language set to '+S.lang+' (preview only)')}});

/* ---------- provider profile ---------- */
const slotOff=(p,dk,t)=>{if(dk===dkey(TODAY)){if(!p.today)return true;return +t.slice(0,2)<=new Date().getHours()}return hash(p.id+dk+t)%4===0};
const freeCount=(p,d)=>SLOTS.filter(t=>!slotOff(p,dkey(d),t)).length;
V.prof=id=>{const p=PV(id),fv=S.fav.includes(p.id),rv=[REV[id%3],REV[(id+1)%3],REV[(id+2)%3]];
 return `<div class="phero"><button class="ib gl2" data-act="back" aria-label="Back">${ic('back')}</button><button class="ib gl2 fav ${fv?'on':''}" data-act="fav" data-v="${p.id}" aria-label="Save">${ic('heart')}</button></div>
 <div class="pbody"><div class="pav">${av(p.n,p.ph,96)}</div><h1 class="ctr">${p.n} ${ic('shield','vf')}</h1><p class="mut ctr">${p.role} · ${p.area}</p>
 <div class="stats"><div><b>${p.yrs}</b><small>years</small></div><div><b>${p.r}</b><small>${p.rv} reviews</small></div><div><b>${p.visits}</b><small>visits</small></div></div>
 <h3>About</h3><p class="mut">${p.bio}</p>
 <h3>Verified by Bushemi</h3><div class="card"><div class="vrow">${ic('check','sm')} ID checked</div><div class="vrow">${ic('check','sm')} Professional licence checked</div><div class="vrow">${ic('check','sm')} Police clearance and references</div></div>
 <h3>Services</h3>${p.svc.map(i=>{const s=svOf(i);return `<div class="li"><span class="ib" style="box-shadow:none;background:${s.c}22;color:${s.c};width:42px;height:42px">${ic(s.i,'sm')}</span><div class="b"><b>${s.full}</b><small>${s.mode==='tele'?'Video call':'At your home'}</small></div><b>${kw(s.p)}</b></div>`}).join('')}
 <h3>Languages</h3><div class="chips">${p.langs.map(l=>`<span class="pill pb">${l}</span>`).join('')}</div>
 <h3>This week</h3><div class="hs">${[0,1,2,3,4,5,6].map(i=>{const d=addD(TODAY,i),n=freeCount(p,d);return `<div class="day" style="cursor:default"><small>${wd(d)}</small><b>${d.getDate()}</b><small style="color:${n?'var(--grn)':'var(--red)'}">${n?n+' free':'full'}</small></div>`}).join('')}</div>
 ${p.svc.includes('care')?`<button class="btn o full" style="margin-top:16px" data-act="place">Request live-in placement</button>`:''}
 <h3>Reviews</h3>${rv.map(r=>`<div class="rev"><div class="between"><b>${r[0]}</b><span class="rt">${ic('star','st').repeat(r[2])}</span></div><p class="mut" style="margin-top:4px">${r[1]}</p></div>`).join('')}</div>
 <div class="bar2"><button class="btn o" data-act="chat" data-v="${p.id}">${ic('chat','sm')} Chat</button><button class="btn" data-act="book" data-v="${p.id}">Book from ${kw(minP(p))}</button></div>`};

 ${p.svc.length>1?`<div class="lab" style="margin-top:0">Service</div><div class="chips">${p.svc.map(i=>`<button class="chip ${B.svc===i?'on':''}" data-act="bsv" data-v="${i}">${svOf(i).full}</button>`).join('')}</div>`:''}
 <div class="lab">Who is it for?</div><div class="chips">${S.fam.map(f=>`<button class="chip ${B.who===f.n?'on':''}" data-act="bwho" data-v="${esc(f.n)}">${esc(f.n)}</button>`).join('')}</div>
 <div class="lab">Day</div><div class="days">${days.map(d=>`<button class="day ${dkey(d)===B.day?'on':''}" data-act="bday" data-v="${dkey(d)}"><small>${wd(d)}</small><b>${d.getDate()}</b><small>${mo(d)}</small></button>`).join('')}</div>
 <div class="lab">Time</div><div class="chips">${SLOTS.map(t=>`<button class="chip ${B.tm===t?'on':''}" data-act="btm" data-v="${t}" ${slotOff(p,B.day,t)?'disabled':''}>${t}</button>`).join('')}</div>
 <div class="lab">Repeat</div><div class="chips">${[[1,'Just once'],[2,'Weekly, 2 weeks'],[4,'Weekly, 4 weeks']].map(r=>`<button class="chip ${B.rep===r[0]?'on':''}" data-act="brep" data-v="${r[0]}">${r[1]}</button>`).join('')}</div>
 ${tele?`<div class="card" style="margin-top:14px;background:var(--grns);box-shadow:none"><b>No address needed</b><p class="mut">You join by video. Keep data or Wi-Fi ready.</p></div>`:`<div class="lab">Where?</div>${S.addrs.map(a=>`<button class="rdo ${B.addr===a.a?'on':''}" data-act="baddr" data-v="${esc(a.a)}"><div class="b"><b>${esc(a.n)}</b><small>${esc(a.a)}</small></div><span class="rd"></span></button>`).join('')}`}
 <label for="bn">Note (optional)</label><textarea id="bn" placeholder="Gate colour, landmark, what care is needed">${esc(B.note)}</textarea>
 <label for="bv">Voucher code</label><div class="row"><input id="bv" placeholder="${VOUCHER}" value="${B.voucher?VOUCHER:''}"><button class="btn o sm" style="flex:none" data-act="bvc">Apply</button></div>
 <div class="lab">Pay with</div><div class="chips">${Object.keys(KINDS).map(k=>`<button class="chip ${B.pay===k?'on':''}" data-act="bpay" data-v="${k}">${KINDS[k][0]}</button>`).join('')}</div>
 ${B.pay==='card'?`<label for="cn">Card number</label><input id="cn" value="4242 4242 4242 4242"><div class="row"><div style="flex:1"><label for="ce">Expiry</label><input id="ce" value="08/29"></div><div style="flex:1"><label for="cv">CVV</label><input id="cv" type="password" value="123"></div></div>`:B.pay==='cash'?`<p class="mut" style="margin-top:8px">Pay at the clinic or at the visit. Held for 48 hours.</p>`:`<label for="mn">Mobile money number</label><input id="mn" type="tel" value="${KINDS[B.pay][1]}">`}
 <div class="card" style="margin-top:16px"><div class="li"><div class="b">${s.full} × ${B.rep}</div><b>${kw(tt.t)}</b></div>${tt.d?`<div class="li" style="color:var(--grn)"><div class="b">Voucher ${VOUCHER}</div><b>-${kw(tt.d)}</b></div>`:''}<div class="tot"><span>Total</span><span>${kw(tt.n)}</span></div></div>
 <button class="btn ac full" data-act="bgo" ${B.tm?'':'disabled'}>${B.tm?(B.pay==='cash'?'Reserve':'Pay '+kw(tt.n)):'Choose a time to continue'}</button>`};
const bsave=()=>{const n=$('#bn');if(n)B.note=n.value};
A.bsv=v=>{bsave();B.svc=v;draw(true)};A.bwho=v=>{bsave();B.who=v;draw(true)};A.bday=v=>{bsave();B.day=v;draw(true)};A.btm=v=>{bsave();B.tm=v;draw(true)};
A.brep=v=>{bsave();B.rep=+v;draw(true)};A.baddr=v=>{bsave();B.addr=v;draw(true)};A.bpay=v=>{bsave();B.pay=v;draw(true)};
A.bvc=()=>{bsave();const c=$('#bv').value.trim().toUpperCase();B.voucher=c===VOUCHER;toast(B.voucher?'10% off applied':'That code is not valid');draw(true)};
A.bgo=()=>{bsave();const p=PV(B.pid),s=svOf(B.svc),tt=bTotal();
 sheet(`<div class="ctr"><div class="spin"></div><h1>${B.pay==='cash'?'Reserving':'Processing payment'}</h1><p class="sub mut">${kw(tt.n)} to Bushemi Clinic.${B.pay==='cash'?'':' Approve it with your PIN on your phone.'}</p></div>`);
 setTimeout(()=>{for(let i=0;i<B.rep;i++)S.appts.push({id:Date.now()+i,pid:p.id,svc:B.svc,who:B.who,d:dkey(addD(dOf(B.day),7*i)),tm:B.tm,st:'Booked',addr:s.mode==='tele'?'':B.addr,amt:Math.round(tt.n/B.rep)});
  if(B.voucher)S.voucherUsed=true;
  sheet(`<div class="ctr"><div class="tick">${ic('check')}</div><h1>${B.pay==='cash'?'Booking reserved':'Booking confirmed'}</h1><p class="mut" style="margin:6px 0">${s.full} with ${p.n}<br>${fmt(dOf(B.day))}, ${B.tm}${B.rep>1?' · weekly for '+B.rep+' weeks':''}</p><p class="mut">You will get a reminder before each visit.</p><button class="btn full" style="margin-top:14px" data-act="bdone">See my bookings</button></div>`)},1900)};
A.bdone=()=>{close();S.tab2='Upcoming';goTab('appts')};

/* ---------- bookings ---------- */
const STC={Booked:'pb',Confirmed:'pg','On the way':'pa','On hold':'pa',Completed:'pb',Cancelled:'pr'};
V.appts=()=>{const past=['Completed','Cancelled'],list=S.appts.filter(a=>S.tab2==='Past'?past.includes(a.st):!past.includes(a.st)).sort(cmpA);if(S.tab2==='Past')list.reverse();
 return `<div class="top"><div class="row"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>Bookings</h1></div></div><div class="tabs">${['Upcoming','Past'].map(t=>`<button class="${S.tab2===t?'on':''}" data-act="atab" data-v="${t}">${t}</button>`).join('')}</div>
 ${list.length?list.map(a=>{const s=svOf(a.svc),p=PV(a.pid),d=dOf(a.d);return `<div class="card"><div class="row"><div class="date">${d.getDate()}<small>${mo(d)}</small></div><div style="flex:1"><b>${s.full}</b><br><small>${p.n} · ${a.tm}</small></div><span class="pill ${STC[a.st]}">${a.st}</span></div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap">${S.tab2==='Past'?`${a.sum?`<button class="btn sm o" data-act="sum" data-v="${a.id}">Summary</button>`:''}${a.rated?`<span class="pill pg">Rated ${a.rated} ★</span>`:`<button class="btn sm" data-act="rate" data-v="${a.id}">Rate visit</button>`}<button class="btn sm o" data-act="book" data-v="${p.id}">Book again</button>`:
  `${a.st==='On the way'?`<button class="btn sm" data-act="track" data-v="${a.id}">Track</button>`:''}${s.mode==='tele'&&a.st==='Confirmed'?`<button class="btn sm" data-act="join">Join call</button>`:''}<button class="btn sm o" data-act="chat" data-v="${p.id}">Chat</button><button class="btn sm o" data-act="resch" data-v="${a.id}">Move</button><button class="btn sm r" data-act="canc" data-v="${a.id}">Cancel</button>`}</div></div>`}).join(''):`<div class="card ctr"><p class="mut">${S.tab2==='Past'?'No past bookings yet.':'Nothing booked yet.'}</p><button class="btn sm" style="margin-top:10px" data-act="tab" data-v="find">Find care</button></div>`}`};
A.atab=v=>{S.tab2=v;draw(true)};
A.canc=v=>sheet(`<h1>Cancel this booking?</h1><p class="mut" style="margin:6px 0 14px">You can book again at any time.</p><div style="display:grid;gap:10px"><button class="btn r" data-act="cancyes" data-v="${v}">Yes, cancel</button><button class="btn o" data-act="close">Keep it</button></div>`);
A.cancyes=v=>{S.appts.find(a=>a.id==v).st='Cancelled';close();draw(true);toast('Booking cancelled')};
A.resch=v=>sheet(`<h1>Pick a new day</h1><div class="chips" style="margin:12px 0">${[1,2,3,4,5,6,7].map(i=>addD(TODAY,i)).map(d=>`<button class="chip" data-act="reschd" data-v="${v}|${dkey(d)}">${fmt(d)}</button>`).join('')}</div>`);
A.reschd=v=>{const[i,d]=v.split('|'),a=S.appts.find(x=>x.id==i);a.d=d;if(a.st==='On the way')a.st='Booked';close();draw(true);toast('Booking moved')};
A.sum=v=>{const a=S.appts.find(x=>x.id==v);sheet(`<h1>Visit summary</h1><p class="mut">${svOf(a.svc).full}, ${fmt(dOf(a.d))}</p><p style="margin:10px 0 16px">${a.sum}</p><div class="row"><button class="btn o" data-act="receipt" data-v="${v}">Receipt</button><button class="btn" data-act="close">Close</button></div>`)};
A.receipt=v=>{const a=S.appts.find(x=>x.id==v);sheet(`<h1>Receipt</h1><div class="card" style="box-shadow:none;border:1px solid var(--line);margin-top:10px"><div class="li"><div class="b">${svOf(a.svc).full}</div><b>${kw(a.amt)}</b></div><div class="li"><div class="b">Provider</div><span>${PV(a.pid).n}</span></div><div class="li"><div class="b">Date</div><span>${fmt(dOf(a.d))}</span></div></div><button class="btn full" data-act="close">Close</button>`)};
A.rate=v=>{S.rt=5;rateSheet(v)};
const rateSheet=v=>sheet(`<div class="ctr"><h1>How was your visit?</h1><div class="row" style="justify-content:center;margin:14px 0">${[1,2,3,4,5].map(n=>`<button class="ib" style="box-shadow:none;background:none" data-act="star" data-v="${v}|${n}" aria-label="${n} stars"><svg class="i" viewBox="0 0 24 24" style="width:36px;height:36px;fill:${n<=S.rt?'#F5A623':'none'};stroke:#F5A623">${IC.star}</svg></button>`).join('')}</div></div><textarea placeholder="Tell others about your experience (optional)"></textarea><button class="btn full" style="margin-top:12px" data-act="rsave" data-v="${v}">Submit review</button>`);
A.star=v=>{const[i,n]=v.split('|');S.rt=+n;rateSheet(i)};
A.rsave=v=>{S.appts.find(a=>a.id==v).rated=S.rt;close();draw(true);toast('Thank you for your review')};
A.join=()=>sheet(`<div class="ctr"><div class="spin"></div><h1>Joining your call</h1><p class="mut" style="margin:6px 0 14px">The video opens when your doctor is ready. Check your camera and microphone.</p><button class="btn o" data-act="close">Close</button></div>`);

/* ---------- live tracking ---------- */
const ROUTE='M32 196 C 90 176 70 118 140 106 S 252 98 304 40';
V.track=id=>{const a=S.appts.find(x=>x.id===id),p=PV(a.pid);
 return hdr('Live tracking')+`<div class="map"><svg viewBox="0 0 340 230" aria-label="Map showing ${p.n} on the way"><g style="stroke:var(--line)" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 60H340M0 130H340M0 200H340M60 0V230M170 0V230M280 0V230"/></g><path id="rt" d="${ROUTE}" fill="none" style="stroke:var(--p)" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/><g transform="translate(304 40)"><circle r="16" style="fill:var(--a)"/><path d="M-6 0l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g id="mk"><circle r="22" style="fill:var(--p)" opacity=".2"/><circle r="11" style="fill:var(--p)" stroke="#fff" stroke-width="3"/></g></svg></div>
 <div class="card"><div class="row">${av(p.n,p.ph,56)}<div style="flex:1"><b>${p.n}</b> ${ic('shield','vf')}<br><small>${p.role}</small></div><a class="ib" href="tel:+260973702227" aria-label="Call">${ic('phone')}</a><button class="ib" data-act="chat" data-v="${p.id}" aria-label="Chat">${ic('chat')}</button></div>
 <div class="between" style="margin-top:14px"><div><small>Arriving in</small><div style="font-size:30px;font-weight:800" id="eta">--</div></div><span class="pill pa" id="tst">On the way</span></div></div>
 <div class="card"><ul class="tl" id="tl"><li class="d"><i>✓</i><b>Booking accepted</b><span>${p.n} confirmed</span></li><li class="n" id="s2"><i>2</i><b>On the way</b><span>Heading to ${esc(a.addr||'you')}</span></li><li id="s3"><i>3</i><b>Arrived</b><span>Welcome ${p.n.split(' ')[0]} in</span></li><li id="s4"><i>4</i><b>Visit complete</b><span>Summary and receipt sent to you</span></li></ul></div>`};
function startTrack(id){const path=$('#rt'),mk=$('#mk');if(!path)return;const len=path.getTotalLength();if(ST.prog[id]==null)ST.prog[id]=.25;
 const tick=()=>{const pr=ST.prog[id],pt=path.getPointAtLength(len*pr);mk.setAttribute('transform',`translate(${pt.x} ${pt.y})`);
  const m=Math.max(0,Math.ceil((1-pr)*18)),eta=$('#eta');if(!eta){clearInterval(ST.tmr);return}
  eta.textContent=pr>=1?'Arrived':m+' min';$('#tst').textContent=pr>=1?'Arrived':'On the way';
  $('#s2').className=pr>=1?'d':'n';$('#s3').className=pr>=1?'n':'';
  if(pr<1)ST.prog[id]=Math.min(1,pr+.03);else clearInterval(ST.tmr)};
 tick();ST.tmr=setInterval(tick,1200)}

/* ---------- messages ---------- */
V.msgs=()=>{const ids=Object.keys(S.threads).map(Number);
 return `<div class="top"><div class="row"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>Messages</h1></div></div>${ids.length?ids.map(id=>{const p=PV(id),t=S.threads[id],l=t[t.length-1];return `<div class="pc" data-act="chat" data-v="${id}">${av(p.n,p.ph,52)}<div class="b"><div class="nm">${p.n}</div><small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l?esc((l.f==='me'?'You: ':'')+l.t):'Say hello'}</small></div>${S.unread[id]?'<span class="pill pr">New</span>':''}</div>`}).join(''):'<div class="card ctr"><p class="mut">No conversations yet. Open a provider and tap Chat.</p></div>'}
 <p class="mut" style="font-size:13px;margin-top:10px">Chat inside the app keeps your phone number private.</p>`};
V.thread=id=>{const p=PV(id),t=S.threads[id];
 return `<div class="thh"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button>${av(p.n,p.ph,42)}<div class="b"><b>${p.n}</b><br><small>${p.today?'Online':'Replies within the hour'}</small></div><a class="ib" href="tel:+260973702227" aria-label="Call">${ic('phone')}</a></div>
 <section class="scr" id="cur" style="padding-bottom:10px">${t.map(m=>`<div class="bub ${m.f}">${esc(m.t)}<small>${m.m}</small></div>`).join('')||'<p class="mut ctr" style="margin-top:20px">Start the conversation</p>'}</section>
 <div class="hs" style="padding:6px 12px 0;background:var(--bg)">${['I am at the gate','Running a little late','Thank you!'].map(q=>`<button class="chip" data-act="quick" data-v="${q}">${q}</button>`).join('')}</div>
 <div class="comp"><input id="msg" placeholder="Type a message" aria-label="Message"><button class="btn" data-act="send" aria-label="Send">${ic('send')}</button></div>`};
const nowT=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function sendMsg(txt){const id=cur().a;if(!txt.trim())return;S.threads[id].push({f:'me',t:txt.trim(),m:nowT()});draw();const i=$('#msg');if(i)i.focus();
 setTimeout(()=>{S.threads[id].push({f:'p',t:REPLIES[hash(txt)%REPLIES.length],m:nowT()});if(cur().v==='thread'&&cur().a===id)draw();else S.unread[id]=1},1300)}
A.send=()=>sendMsg($('#msg').value);A.quick=v=>sendMsg(v);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg')sendMsg(e.target.value)});

 return `<div class="top"><div class="row"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>My health</h1></div><button class="btn sm" data-act="addv">${ic('plus','sm')} Reading</button></div>
 <div class="card"><div class="vit"><div class="b"><small>Blood pressure</small><br><b class="n">${L(v.bp)}/${L(v.bpd)}</b> <small>mmHg</small></div><div class="sp">${spark(v.bp,'var(--p)')}</div></div></div>
 <div class="card"><div class="vit"><div class="b"><small>Blood sugar</small><br><b class="n">${L(v.sugar)}</b> <small>mmol/L</small></div><div class="sp">${spark(v.sugar,'var(--a)')}</div></div></div>
 <div class="card"><div class="vit"><div class="b"><small>Weight</small><br><b class="n">${L(v.weight)}</b> <small>kg</small></div><div class="sp">${spark(v.weight,'#E5533D')}</div></div></div>
 <button class="btn o full" data-act="shareDoc">Share with my doctor</button>

 <h2>Saved providers</h2>${S.fav.length?S.fav.map(id=>pcard(PV(id))).join(''):'<div class="card"><p class="mut">Tap the heart on a provider to save them here.</p></div>'}
 <h2>Family <a data-act="addfam">+ Add</a></h2><div class="card">${S.fam.map(f=>`<div class="li">${av(f.n,'',42)}<div class="b"><b>${esc(f.n)}</b><small>${esc(f.r)}</small></div></div>`).join('')}</div>
 <h2>Addresses <a data-act="addaddr">+ Add</a></h2><div class="card">${S.addrs.map(a=>`<div class="li"><div class="b"><b>${esc(a.n)}</b><small>${esc(a.a)}</small></div></div>`).join('')}</div>
 <h2>Payment methods</h2><div class="card">${S.methods.map(m=>`<div class="li"><span class="ib" style="box-shadow:none;background:var(--soft);color:var(--p);width:42px;height:42px">${ic('wallet','sm')}</span><div class="b"><b>${KINDS[m.k][0]}</b><small>${m.s}</small></div><span class="pill pg">Default</span></div>`).join('')}</div>
 <h2>Settings</h2><div class="card"><div class="li"><div class="b"><b>Language</b></div><select id="lng" style="width:140px" aria-label="Language">${['English','Nyanja','Bemba'].map(l=>`<option ${S.lang===l?'selected':''}>${l}</option>`).join('')}</select></div></div>
 <div style="display:grid;gap:10px"><button class="btn o" data-act="switch">Switch to caregiver mode</button><button class="btn r" data-act="signout">Sign out</button></div>`;
A.addfam=()=>sheet(`<h1>Add a family member</h1><label for="fn">Full name</label><input id="fn"><label for="fr">Relationship</label><select id="fr"><option>Mother</option><option>Father</option><option>Child</option><option>Spouse</option><option>Other</option></select><button class="btn full" style="margin-top:14px" data-act="savefam">Save</button>`);
A.savefam=()=>{S.fam.push({n:$('#fn').value.trim()||'Family member',r:$('#fr').value});close();draw(true)};

/* ---------- caregiver mode ---------- */
const DN=['M','T','W','T','F','S','S'];
V.jobs=()=>{const c=S.cg,wk=c.week.reduce((a,b)=>a+b,0);
 return `<div class="top"><div><small>Caregiver mode</small><h1>Hi, ${c.name.split(' ')[0]}</h1></div><button class="chip" data-act="switch">Client view</button></div>
 <div class="hero"><div class="between"><div><div class="hl" style="margin-top:0">${c.on?'You are online':'You are offline'}</div><div class="hsub">${c.on?'Clients can book you now':'Go online to receive requests'}</div></div><button class="sw ${c.on?'on':''}" data-act="cgon" role="switch" aria-checked="${c.on}" aria-label="Online"></button></div></div>
 <div class="stats"><div><b>${kw(wk)}</b><small>this week</small></div><div><b>4.9</b><small>rating</small></div><div><b>${c.sched.length}</b><small>today</small></div></div>
 <h2>New requests</h2>${c.jobs.length?c.jobs.map(j=>`<div class="card"><div class="between"><b>${j.svc}</b><b>${kw(j.pay)}</b></div><small>${j.who} · ${j.area}</small><div class="meta" style="margin:6px 0 12px">${ic('clock','sm')} ${j.when}</div><div class="row"><button class="btn r sm" style="flex:1" data-act="jdec" data-v="${j.id}">Decline</button><button class="btn ac sm" style="flex:1" data-act="jacc" data-v="${j.id}">Accept</button></div></div>`).join(''):'<div class="card ctr"><p class="mut">No new requests right now.</p></div>'}
 <h2>Profile strength</h2><div class="card"><div class="between" style="margin-bottom:8px"><b>85% complete</b><span class="pill pg">${ic('shield','sm')} Verified</span></div><div class="pbar"><i style="width:85%"></i></div><small style="display:block;margin-top:8px">Add a short video introduction to get more bookings.</small></div>`};
A.cgon=()=>{S.cg.on=!S.cg.on;draw(true)};
A.jdec=v=>{S.cg.jobs=S.cg.jobs.filter(j=>j.id!=v);draw(true);toast('Request declined')};
A.jacc=v=>{const j=S.cg.jobs.find(x=>x.id==v);S.cg.sched.push(j);S.cg.jobs=S.cg.jobs.filter(x=>x.id!=v);draw(true);toast('Accepted. Added to your schedule.')};
V.sched=()=>{const c=S.cg;
 return `${hdr('Schedule')}<h2 style="margin-top:6px">Upcoming jobs</h2>${c.sched.length?c.sched.map(j=>`<div class="card"><div class="between"><b>${j.svc}</b><b>${kw(j.pay)}</b></div><small>${j.who}</small><div class="meta" style="margin-top:6px">${ic('clock','sm')} ${j.when}</div></div>`).join(''):'<div class="card ctr"><p class="mut">Nothing scheduled yet.</p></div>'}
 <h2>My availability</h2><div class="card"><div class="lab" style="margin-top:0">Days I work</div><div class="chips">${DN.map((d,i)=>`<button class="chip ${c.days[i]?'on':''}" data-act="cgday" data-v="${i}" style="width:42px;padding:0">${d}</button>`).join('')}</div><div class="lab">Shifts</div><div class="chips">${['Morning','Afternoon','Evening','Night'].map(s=>`<button class="chip ${c.shifts.includes(s)?'on':''}" data-act="cgshift" data-v="${s}">${s}</button>`).join('')}</div><small style="display:block;margin-top:10px">Clients only see times inside your availability.</small></div>`};
A.cgday=v=>{S.cg.days[+v]=S.cg.days[+v]?0:1;draw(true)};
A.cgshift=v=>{const a=S.cg.shifts,i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v);draw(true)};
V.earn=()=>{const c=S.cg,mx=Math.max(...c.week,1),tot=c.week.reduce((a,b)=>a+b,0);
 return `${hdr('Earnings')}<div class="hero"><small style="color:#fff;opacity:.8">Available balance</small><div style="font-size:36px;font-weight:800">${kw(c.bal)}</div><button class="btn w sm" style="margin-top:10px" data-act="payout" ${c.bal?'':'disabled'}>Withdraw to Mobile Money</button></div>
 <div class="card"><div class="between"><b>Last 7 days</b><b>${kw(tot)}</b></div><div class="bars">${c.week.map((v,i)=>`<div><i style="height:${Math.max(4,v/mx*100)}%"></i><small>${wd(addD(TODAY,i-6))[0]}</small></div>`).join('')}</div></div>
 <div class="card">${[['Nurse home visit','Yesterday',350],['Elderly care (day)','Mon',420],['Wound dressing','Sun',300]].map(r=>`<div class="li"><div class="b"><b>${r[0]}</b><small>${r[1]}</small></div><b>${kw(r[2])}</b></div>`).join('')}</div>`};
A.payout=()=>sheet(`<h1>Withdraw ${kw(S.cg.bal)}</h1><p class="mut" style="margin:6px 0 12px">Sent to MTN Mobile Money 096 123 4567.</p><button class="btn full" data-act="payok">Confirm withdrawal</button>`);
A.payok=()=>{S.cg.bal=0;close();draw(true);toast('Withdrawal sent')};

V.onb=V.onb;applyLook();draw();
</script>
</body></html>
